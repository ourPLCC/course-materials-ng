name: Release edition

on:
  workflow_dispatch:
    inputs:
      edition:
        description: "Edition name, e.g. 2026.09"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  release:
    name: Cut edition
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Validate edition name
        env:
          EDITION: ${{ inputs.edition }}
        run: |
          if ! [[ "$EDITION" =~ ^[0-9]{4}\.[0-9]{2}$ ]]; then
            echo "Edition must match YYYY.MM, e.g. 2026.09 (got: $EDITION)" >&2
            exit 1
          fi
      - name: Deploy edition
        env:
          EDITION: ${{ inputs.edition }}
        run: |
          mike deploy --push --update-aliases "$EDITION" latest
          mike set-default --push latest
